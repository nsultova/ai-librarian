<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Library</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>Private Library RAG</h1>
        
        <form action="/search" method="post" class="search-form">
            <input type="text" name="query" placeholder="Ask your library..." required value="{{ query or '' }}" autocomplete="off">
            <button type="submit">Ask</button>
        </form>

        {% if answer %}
        <div class="result-section">
            <h2>Answer</h2>
            <div class="answer-box">
                {{ answer }}
            </div>
            
            {% if sources %}
            <div class="sources">
                <small>Sources: {{ sources|join(', ') }}</small>
            </div>
            {% endif %}
        </div>
        {% endif %}

        <div class="upload-section">
            <h3>Add Documents</h3>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".pdf,.epub" required>
                <button type="submit" class="secondary">Ingest</button>
            </form>
            
            {% if message %}
                <p class="success">{{ message }}</p>
            {% endif %}
        </div>
    </div>

</body>
</html>
